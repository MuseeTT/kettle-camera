<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ケトル手動カット試験 カメラ版</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#1a1a1a;--body:#333333;--muted:#666666;--border:#949494;--key:#2266ff;--alarm:#ce0000;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;color:var(--ink);margin:0;line-height:1.4}
label{font-size:14px;font-weight:700;color:var(--ink)}
input[type=password]{font:inherit;font-size:20px;border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;color:var(--ink);background:var(--bg)}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--body)}
.remember input{width:18px;height:18px;accent-color:var(--key);margin:0}
button{font:inherit;font-size:17px;font-weight:700;border-radius:10px;min-height:52px;border:2px solid var(--key);background:var(--key);color:#ffffff;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--key);outline-offset:2px}
.msg{font-size:14px;min-height:1.6em;color:var(--muted)}
.msg.err{color:var(--alarm);font-weight:700}
</style>
</head>
<body>
<form id="gate" autocomplete="on">
  <h1>ケトル手動カット試験 カメラ版</h1>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="pw">パスワード</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>
  <label class="remember"><input id="remember" type="checkbox" checked>このスマホでは次から入力しない</label>
  <button id="go" type="submit">開く</button>
  <p class="msg" id="msg" role="status"></p>
</form>
