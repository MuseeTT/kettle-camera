<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ケトル手動カット試験 カメラ版</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#1a1a1a;--body:#333333;--muted:#666666;--border:#949494;--key:#2266ff;--alarm:#ce0000;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;color:var(--ink);margin:0;line-height:1.4}
label{font-size:14px;font-weight:700;color:var(--ink)}
input[type=password]{font:inherit;font-size:20px;border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;color:var(--ink);background:var(--bg)}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--body)}
.remember input{width:18px;height:18px;accent-color:var(--key);margin:0}
button{font:inherit;font-size:17px;font-weight:700;border-radius:10px;min-height:52px;border:2px solid var(--key);background:var(--key);color:#ffffff;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--key);outline-offset:2px}
.msg{font-size:14px;min-height:1.6em;color:var(--muted)}
.msg.err{color:var(--alarm);font-weight:700}
</style>
</head>
<body>
<form id="gate" autocomplete="on">
  <h1>ケトル手動カット試験 カメラ版</h1>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="pw">パスワード</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>
  <label class="remember"><input id="remember" type="checkbox" checked>このスマホでは次から入力しない</label>
  <button id="go" type="submit">開く</button>
  <p class="msg" id="msg" role="status"></p>
</form>

    var raw = b64(DATA), salt = raw.slice(8, 16), ct = raw.slice(16);   // OpenSSL "Salted__" + 8-byte salt + AES-256-CBC
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var bits = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256"}, base, 384));
    var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, ct));
    if (html.slice(0, 15).toLowerCase() !== "<!doctype html>") throw new Error("bad");
    return html;
  }
  async function tryOpen(pw) {
    var cands = [pw.trim()]; if (pw.trim().toLowerCase() !== pw.trim()) cands.push(pw.trim().toLowerCase());
    for (var i = 0; i < cands.length; i++) { try { return {html: await decrypt(cands[i]), pw: cands[i]}; } catch (e) {} }
    return null;
  }
  var busy = false, shown = false;
  function show(html) { if (shown) return; shown = true; document.open(); document.write(html); document.close(); }
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "このブラウザでは開けません。https のアドレスで開いてください。"; msg.className = "msg err"; go.disabled = true; return; }
  document.getElementById("gate").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (busy || shown) return;
    busy = true; go.disabled = true; msg.className = "msg"; msg.textContent = "確認しています…";
    var r = await tryOpen(document.getElementById("pw").value);
    if (!r) { busy = false; go.disabled = false; msg.className = "msg err"; msg.textContent = "パスワードが違います。"; return; }
    try { if (document.getElementById("remember").checked) localStorage.setItem(KEY, r.pw); else localStorage.removeItem(KEY); } catch (err) {}
    show(r.html);
  });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    msg.textContent = "開いています…"; go.disabled = true; busy = true;
    tryOpen(saved).then(function (r) {
      if (r) show(r.html);
      else { try { localStorage.removeItem(KEY); } catch (e) {} busy = false; go.disabled = false; msg.textContent = ""; }
    });
  }
})();
</script>
